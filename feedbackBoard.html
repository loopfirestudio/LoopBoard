<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Ideas Board — LoopFire Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #1a1f2e;
  --surface:    #242938;
  --surface2:   #2e3347;
  --border:     #3a4060;
  --border-lit: #4a5280;
  --accent:     #4f8ef7;
  --accent2:    #7c5cfc;
  --accent-dim: #2a4a8a;
  --green:      #3dd68c;
  --red:        #f75f5f;
  --yellow:     #f7c94f;
  --text:       #e8eaf0;
  --text-dim:   #8b92b0;
  --text-muted: #555e7a;
  --win-bar1:   #1e2438;
  --win-bar2:   #262d42;
  --radius:     6px;
  --radius-lg:  10px;
}

html, body {
  height: 100%;
  font-family: 'Ubuntu', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── TITLEBAR (Windows chrome) ─── */
#titlebar {
  background: linear-gradient(90deg, #0d1117 0%, #1a2035 100%);
  border-bottom: 1px solid var(--border);
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  flex-shrink: 0;
  user-select: none;
}
.tb-icon { font-size: 16px; }
.tb-title {
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  flex: 1;
  letter-spacing: 0.3px;
}
.tb-btns { display: flex; gap: 6px; margin-left: auto; }
.tb-btn {
  width: 13px; height: 13px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px;
  font-weight: bold;
  color: transparent;
  transition: color 0.15s;
}
.tb-btn:hover { color: rgba(0,0,0,0.7); }
.tb-btn.close  { background: #ff5f57; }
.tb-btn.min    { background: #febc2e; }
.tb-btn.max    { background: #28c840; }

/* ─── MENUBAR ─── */
#menubar {
  background: var(--win-bar1);
  border-bottom: 1px solid var(--border);
  height: 30px;
  display: flex;
  align-items: stretch;
  padding: 0 8px;
  flex-shrink: 0;
}
.menu-item {
  padding: 0 14px;
  display: flex;
  align-items: center;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 4px;
  margin: 3px 2px;
  transition: background 0.1s, color 0.1s;
}
.menu-item:hover { background: var(--surface2); color: var(--text); }

/* ─── TOOLBAR ─── */
#toolbar {
  background: var(--win-bar2);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.tb-action-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.tb-action-btn:hover  { background: var(--surface); border-color: var(--border-lit); }
.tb-action-btn:active { transform: scale(0.97); }
.tb-action-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
.tb-action-btn.primary:hover { background: #3a7ee0; border-color: #3a7ee0; }
.tb-action-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}
.tb-sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 4px;
}
#search-wrap {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 10px;
  gap: 6px;
  transition: border-color 0.15s;
}
#search-wrap:focus-within { border-color: var(--accent); }
#search-wrap span { color: var(--text-muted); font-size: 13px; }
#search-input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  width: 180px;
}
#search-input::placeholder { color: var(--text-muted); }
#conn-indicator {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
}
#conn-dot { font-size: 9px; }

/* ─── CATEGORY TABS ─── */
#tab-bar {
  background: var(--win-bar1);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 2px;
  flex-shrink: 0;
  overflow-x: auto;
}
#tab-bar::-webkit-scrollbar { height: 0; }
.tab {
  padding: 8px 16px;
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}
.tab:hover { color: var(--text-dim); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 500;
}

/* ─── MAIN CONTENT ─── */
#content-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
#content-wrap::-webkit-scrollbar { width: 8px; }
#content-wrap::-webkit-scrollbar-track { background: transparent; }
#content-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
#content-wrap::-webkit-scrollbar-thumb:hover { background: var(--border-lit); }

/* ─── GRID ─── */
#ideas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

/* ─── CARD ─── */
.idea-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
}
.idea-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-lit);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.card-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.card-cat-icon {
  font-size: 20px;
  line-height: 1;
  margin-top: 1px;
}
.card-header-text { flex: 1; min-width: 0; }
.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-author {
  font-size: 12px;
  color: var(--accent);
  margin-top: 3px;
  font-weight: 500;
}

.card-body {
  padding: 12px 14px;
  flex: 1;
}
.card-text {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.55;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.card-footer {
  padding: 8px 14px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.card-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
  font-family: 'Ubuntu Mono', monospace;
}
.vote-area {
  display: flex;
  align-items: center;
  gap: 5px;
}
.vote-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-size: 13px;
  padding: 3px 8px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s, color 0.1s;
  font-family: 'Ubuntu', sans-serif;
}
.vote-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.vote-count {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
  font-family: 'Ubuntu Mono', monospace;
  min-width: 18px;
}

/* ─── EMPTY / LOADING ─── */
#loading-state, #empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 40px;
  gap: 14px;
  color: var(--text-muted);
}
#loading-state .spin {
  font-size: 36px;
  animation: spin 1.2s linear infinite;
  display: block;
}
@keyframes spin { to { transform: rotate(360deg); } }
#empty-state .empty-icon { font-size: 48px; }
#empty-state p { font-size: 15px; color: var(--text-dim); }
#empty-state small { font-size: 13px; }

/* ─── STATUSBAR ─── */
#statusbar {
  background: var(--win-bar1);
  border-top: 1px solid var(--border);
  height: 26px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 16px;
  flex-shrink: 0;
}
.status-seg {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.status-seg + .status-seg { border-left: 1px solid var(--border); padding-left: 16px; }
#status-clock { margin-left: auto; font-family: 'Ubuntu Mono', monospace; font-size: 12px; color: var(--text-dim); }

/* ─── MODAL OVERLAY ─── */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(3px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#modal-overlay.open { display: flex; }

.dialog-box {
  background: var(--surface);
  border: 1px solid var(--border-lit);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  width: min(500px, 94vw);
  overflow: hidden;
  animation: popIn 0.18s ease;
}
@keyframes popIn {
  from { transform: scale(0.93) translateY(10px); opacity: 0; }
  to   { transform: scale(1) translateY(0);        opacity: 1; }
}
.dialog-titlebar {
  background: linear-gradient(90deg, #0d1117, #1a2035);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dialog-titlebar span { font-size: 14px; font-weight: 700; flex: 1; }
.dialog-close {
  background: none; border: none; color: var(--text-muted); font-size: 18px;
  cursor: pointer; line-height: 1; padding: 0 2px;
  transition: color 0.1s;
}
.dialog-close:hover { color: var(--red); }

.dialog-content { padding: 20px; }
.field-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field-row label { font-size: 13px; font-weight: 500; color: var(--text-dim); }
.win-input, .win-textarea, .win-select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  color: var(--text);
  width: 100%;
  transition: border-color 0.15s;
  outline: none;
}
.win-input:focus, .win-textarea:focus, .win-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
}
.win-select { cursor: pointer; }
.win-textarea { height: 90px; resize: vertical; }

#input-error { color: var(--red); font-size: 12px; display: none; margin-top: -6px; }

.dialog-actions {
  padding: 12px 20px 18px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border);
}
.btn-primary {
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  color: #fff;
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 7px 22px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: #3a7ee0; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-secondary {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  font-family: 'Ubuntu', sans-serif;
  font-size: 13px;
  padding: 7px 22px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover { background: var(--surface); }

/* ─── DETAIL DIALOG ─── */
#detail-dialog {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(3px);
  z-index: 1001;
  align-items: center;
  justify-content: center;
}
#detail-dialog .dialog-box { width: min(560px, 94vw); }
#detail-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
#detail-meta  { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
#detail-meta span { display: flex; align-items: center; gap: 4px; }
#detail-body  { font-size: 14px; color: var(--text-dim); line-height: 1.65; margin-bottom: 14px; white-space: pre-wrap; }
#detail-tags  { display: flex; gap: 8px; flex-wrap: wrap; }

/* ─── TOAST ─── */
#notif {
  position: fixed;
  bottom: 36px;
  right: 16px;
  background: var(--surface2);
  border: 1px solid var(--border-lit);
  border-radius: var(--radius-lg);
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 9999;
  display: none;
  animation: toastIn 0.2s ease;
}
@keyframes toastIn {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <span class="tb-icon">🎮</span>
  <span class="tb-title">LoopFire Studio — Game Ideas Board v2.0</span>
  <div class="tb-btns">
    <button class="tb-btn close" title="Schließen">✕</button>
    <button class="tb-btn min"   title="Minimieren">–</button>
    <button class="tb-btn max"   title="Maximieren">+</button>
  </div>
</div>

<!-- MENUBAR -->
<div id="menubar">
  <div class="menu-item">Datei</div>
  <div class="menu-item">Bearbeiten</div>
  <div class="menu-item">Ansicht</div>
  <div class="menu-item">Extras</div>
  <div class="menu-item">?</div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tb-action-btn primary" onclick="openNewIdeaDialog()">
    <span>＋</span> Neue Idee
  </button>
  <button class="tb-action-btn" onclick="loadIdeas()">↻ Aktualisieren</button>
  <div class="tb-sep"></div>
  <button class="tb-action-btn" id="sort-date-btn"  onclick="sortBy('date')"  >📅 Neueste</button>
  <button class="tb-action-btn" id="sort-votes-btn" onclick="sortBy('votes')" >🏆 Beliebteste</button>
  <div class="tb-sep"></div>
  <div id="search-wrap">
    <span>🔍</span>
    <input id="search-input" type="text" placeholder="Ideen durchsuchen…" oninput="filterIdeas()">
  </div>
  <div id="conn-indicator">
    <span id="conn-dot">⬤</span>
    <span id="conn-text">Verbinde…</span>
  </div>
</div>

<!-- TABS -->
<div id="tab-bar">
  <button class="tab active" onclick="setCategory('Alle')">Alle</button>
  <button class="tab" onclick="setCategory('Gameplay')">⚔️ Gameplay</button>
  <button class="tab" onclick="setCategory('Story')">📖 Story</button>
  <button class="tab" onclick="setCategory('Design')">🎨 Design</button>
  <button class="tab" onclick="setCategory('Sound')">🎵 Sound</button>
  <button class="tab" onclick="setCategory('Level')">🗺️ Level</button>
  <button class="tab" onclick="setCategory('Sonstiges')">💡 Sonstiges</button>
</div>

<!-- CONTENT -->
<div id="content-wrap">
  <div id="loading-state">
    <span class="spin">⟳</span>
    <p>Lade Ideen aus der Datenbank…</p>
  </div>
  <div id="empty-state" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>Keine Ideen gefunden.</p>
    <small>Sei der Erste und poste eine Idee!</small>
  </div>
  <div id="ideas-grid" style="display:none;"></div>
</div>

<!-- STATUSBAR -->
<div id="statusbar">
  <div class="status-seg" id="status-left">Bereit</div>
  <div class="status-seg" id="status-count">0 Ideen</div>
  <div id="status-clock"></div>
</div>

<!-- NEW IDEA DIALOG -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="dialog-box" onclick="event.stopPropagation()">
    <div class="dialog-titlebar">
      <span>💡 Neue Idee einreichen</span>
      <button class="dialog-close" onclick="closeDialog()">×</button>
    </div>
    <div class="dialog-content">
      <div class="field-row">
        <label for="input-name">👤 Dein Name *</label>
        <input id="input-name" class="win-input" type="text" placeholder="z.B. Max Mustermann" maxlength="40">
      </div>
      <div class="field-row">
        <label for="input-title">📌 Titel der Idee *</label>
        <input id="input-title" class="win-input" type="text" placeholder="z.B. Dynamisches Wettersystem" maxlength="60">
      </div>
      <div class="field-row">
        <label for="input-idea">📝 Beschreibung *</label>
        <textarea id="input-idea" class="win-textarea" placeholder="Beschreibe deine Idee für das Spiel…"></textarea>
      </div>
      <div class="field-row">
        <label for="input-category">🏷️ Kategorie</label>
        <select id="input-category" class="win-select">
          <option value="Gameplay">⚔️ Gameplay</option>
          <option value="Story">📖 Story</option>
          <option value="Design">🎨 Design</option>
          <option value="Sound">🎵 Sound</option>
          <option value="Level">🗺️ Level</option>
          <option value="Sonstiges">💡 Sonstiges</option>
        </select>
      </div>
      <div id="input-error"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn-secondary" onclick="closeDialog()">Abbrechen</button>
      <button class="btn-primary" id="submit-btn" onclick="submitIdea()">Idee einreichen</button>
    </div>
  </div>
</div>

<!-- DETAIL DIALOG -->
<div id="detail-dialog" onclick="closeDetail()">
  <div class="dialog-box" onclick="event.stopPropagation()">
    <div class="dialog-titlebar">
      <span id="detail-dialog-title">📄 Details</span>
      <button class="dialog-close" onclick="closeDetail()">×</button>
    </div>
    <div class="dialog-content">
      <div id="detail-title"></div>
      <div id="detail-meta"></div>
      <hr style="border:none; border-top:1px solid var(--border); margin:0 0 14px;">
      <div id="detail-body"></div>
      <div id="detail-tags"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn-primary" onclick="closeDetail()">Schließen</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="notif"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc,
  doc, orderBy, query, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAy16r_mgPt39-O5ol2CWShH-Zl_v13OoU",
  authDomain: "loopfire-studio.firebaseapp.com",
  databaseURL: "https://loopfire-studio-default-rtdb.firebaseio.com",
  projectId: "loopfire-studio",
  storageBucket: "loopfire-studio.firebasestorage.app",
  messagingSenderId: "671968406115",
  appId: "1:671968406115:web:d5250c8fb2d43034b26656"
});
const db = getFirestore(app);
const colRef = collection(db, "Feedback");

let allIdeas = [], currentCategory = "Alle", currentSort = "date", searchQuery = "";

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('status-clock').textContent =
    now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + '  ' +
    now.toLocaleDateString('de-DE');
}
updateClock(); setInterval(updateClock, 15000);

// Live sync
const q = query(colRef, orderBy("timestamp","desc"));
onSnapshot(q, snap => {
  allIdeas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById('conn-dot').style.color  = '#3dd68c';
  document.getElementById('conn-text').textContent = 'Live';
  renderIdeas();
}, err => {
  document.getElementById('conn-dot').style.color  = '#f75f5f';
  document.getElementById('conn-text').textContent = 'Offline';
  showNotif('⚠️ Datenbankverbindung fehlgeschlagen');
});

// Render
function renderIdeas() {
  let ideas = [...allIdeas];
  if (currentCategory !== "Alle") ideas = ideas.filter(i => i.category === currentCategory);
  if (searchQuery) {
    const sq = searchQuery.toLowerCase();
    ideas = ideas.filter(i =>
      (i.title||'').toLowerCase().includes(sq) ||
      (i.idea||'').toLowerCase().includes(sq)  ||
      (i.author||'').toLowerCase().includes(sq)
    );
  }
  if (currentSort === 'votes') ideas.sort((a,b) => (b.votes||0)-(a.votes||0));

  const grid = document.getElementById('ideas-grid');
  const loading = document.getElementById('loading-state');
  const empty   = document.getElementById('empty-state');
  loading.style.display = 'none';

  if (!ideas.length) {
    grid.style.display = 'none';
    empty.style.display = 'flex';
  } else {
    empty.style.display = 'none';
    grid.style.display  = 'grid';
    grid.innerHTML = '';
    ideas.forEach(i => grid.appendChild(makeCard(i)));
  }
  const total = allIdeas.length;
  document.getElementById('status-count').textContent = `${ideas.length} Idee${ideas.length!==1?'n':''}`;
  document.getElementById('status-left').textContent  = `${total} gesamt · Live-Sync aktiv`;
}

const catIcons = { Gameplay:'⚔️', Story:'📖', Design:'🎨', Sound:'🎵', Level:'🗺️', Sonstiges:'💡' };
const catColors = { Gameplay:'#f7c94f', Story:'#7c5cfc', Design:'#f75f5f', Sound:'#3dd68c', Level:'#4f8ef7', Sonstiges:'#8b92b0' };

function makeCard(idea) {
  const card = document.createElement('div');
  card.className = 'idea-card';
  const icon  = catIcons[idea.category] || '💡';
  const color = catColors[idea.category] || '#8b92b0';
  const date  = idea.timestamp?.toDate
    ? idea.timestamp.toDate().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})
    : '—';
  const votes = idea.votes || 0;

  card.innerHTML = `
    <div class="card-header">
      <div class="card-cat-icon">${icon}</div>
      <div class="card-header-text">
        <div class="card-title">${esc(idea.title||'Unbekannt')}</div>
        <div class="card-author">${esc(idea.author||'Anonym')}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-text">${esc(trunc(idea.idea||'',120))}</div>
    </div>
    <div class="card-footer">
      <span class="card-tag" style="border-color:${color}40; color:${color};">${esc(idea.category||'Sonstiges')}</span>
      <div class="vote-area">
        <button class="vote-btn" onclick="event.stopPropagation(); vote('${idea.id}',${votes})">👍</button>
        <span class="vote-count">${votes}</span>
      </div>
      <span class="card-date">${date}</span>
    </div>`;
  card.addEventListener('click', () => showDetail(idea));
  return card;
}

function trunc(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Vote
window.vote = async (id, cur) => {
  try { await updateDoc(doc(db,"Feedback",id),{votes:cur+1}); showNotif('👍 Vote gezählt!'); }
  catch { showNotif('⚠️ Vote fehlgeschlagen'); }
};

// Submit
window.submitIdea = async () => {
  const name  = document.getElementById('input-name').value.trim();
  const title = document.getElementById('input-title').value.trim();
  const idea  = document.getElementById('input-idea').value.trim();
  const cat   = document.getElementById('input-category').value;
  const errEl = document.getElementById('input-error');
  if (!name||!title||!idea) { errEl.textContent='⚠️ Bitte alle Pflichtfelder ausfüllen!'; errEl.style.display='block'; return; }
  errEl.style.display='none';
  const btn = document.getElementById('submit-btn');
  btn.textContent = '⏳ Senden…'; btn.disabled = true;
  try {
    await addDoc(colRef,{author:name,title,idea,category:cat,votes:0,timestamp:serverTimestamp()});
    closeDialog(); showNotif('✅ Idee erfolgreich eingereicht!');
  } catch(e) { errEl.textContent='⚠️ Fehler: '+e.message; errEl.style.display='block'; }
  finally { btn.textContent='Idee einreichen'; btn.disabled=false; }
};

// Detail
window.showDetail = idea => {
  const date = idea.timestamp?.toDate ? idea.timestamp.toDate().toLocaleString('de-DE') : '—';
  const color = catColors[idea.category]||'#8b92b0';
  document.getElementById('detail-dialog-title').textContent = idea.title;
  document.getElementById('detail-title').textContent = idea.title;
  document.getElementById('detail-meta').innerHTML = `
    <span>👤 ${esc(idea.author||'Anonym')}</span>
    <span>📅 ${date}</span>
    <span>👍 ${idea.votes||0} Votes</span>`;
  document.getElementById('detail-body').textContent = idea.idea;
  document.getElementById('detail-tags').innerHTML =
    `<span class="card-tag" style="border-color:${color}40;color:${color};">${esc(idea.category||'Sonstiges')}</span>`;
  document.getElementById('detail-dialog').style.display = 'flex';
};
window.closeDetail = () => { document.getElementById('detail-dialog').style.display='none'; };

// Dialog
window.openNewIdeaDialog = () => {
  ['input-name','input-title','input-idea'].forEach(id => document.getElementById(id).value='');
  document.getElementById('input-error').style.display='none';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('input-name').focus(),80);
};
window.closeDialog = () => document.getElementById('modal-overlay').classList.remove('open');
window.handleOverlayClick = e => { if(e.target===document.getElementById('modal-overlay')) closeDialog(); };

// Filters
window.loadIdeas = () => showNotif('🔄 Synchronisiere…');
window.sortBy = type => {
  currentSort = type;
  document.getElementById('sort-votes-btn').classList.toggle('active', type==='votes');
  document.getElementById('sort-date-btn').classList.toggle('active', type==='date');
  renderIdeas();
};
window.setCategory = cat => {
  currentCategory = cat;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active',
      cat==='Alle' ? t.textContent.trim()==='Alle' : t.textContent.includes(cat));
  });
  renderIdeas();
};
window.filterIdeas = () => { searchQuery=document.getElementById('search-input').value.trim(); renderIdeas(); };

// Toast
function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2800);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeDialog(); closeDetail(); }
  if (e.key==='Enter' && e.ctrlKey && document.getElementById('modal-overlay').classList.contains('open')) window.submitIdea();
});
</script>
</body>
</html>
